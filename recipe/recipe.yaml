schema_version: 1

context:
  goname: github.com/grafana/k6
  version: "1.2.3"
  name: ${{ goname.split('/')[-1] }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://${{ goname }}/archive/v${{ version }}.tar.gz
  sha256: f89052128ccf12252fb6d58bb236e348c7f7f9afec80ca73323848a6f6af7ef2

build:
  number: 1
  script:
    - if: unix
      then: go build -trimpath -ldflags "-s -w" -o $PREFIX/bin/
    - if: win
      then: go build -trimpath -ldflags "-s -w" -o %LIBRARY_BIN%/
    - go-licenses save . --save_path="./license-files/" --ignore go.k6.io/k6 --ignore github.com/grafana --ignore buf.build/gen/go

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - ${{ name }} version

about:
  summary: A modern load testing tool, using Go and JavaScript
  description: |
    k6 is a modern load-testing tool, built on our years of experience in the performance and testing industries. It's built to be powerful, extensible, and full-featured. The key design goal is to provide the best developer experience.
  license: AGPL-3.0-only
  license_file:
    - LICENSE.md
    - license-files/
  homepage: https://${{ goname }}

extra:
  recipe-maintainers:
    - seowalex
